[project]
name = "knock-audio"
version = "0.1.0"
description = "Rust audio engine for Knock (modal synthesis, room/mic model, features)."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "knock_audio"
features = ["python"]

[tool.uv]
# rebuild the extension when the Rust sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]
